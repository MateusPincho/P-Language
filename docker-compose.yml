services:
  p:
    build:
      context: .
      args:
        # The container user gets these ids so files it writes into the repo
        # (PGenerated/, PCheckerOutput/) are owned by you. Defaults to 1000;
        # otherwise build with: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose build
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: p-language:latest
    # The repo is mounted at /workspace; use paths relative to the repo root.
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
